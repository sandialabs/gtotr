[project]
name = "gtotr"
dynamic = ["version"]
description = "Generalized Tensor-on-Tensor Regression (GToTR)"
authors = [
    { name = "Danny Dunlavy", email = "dmdunla@sandia.gov" }, 
    { name = "Carlos Llosa", email = "cjllosa@sandia.gov" },
    { name = "Jeremy Myers", email = "jeremy.moulton.myers@gmail.com" },
]
dependencies = [
    "pyttb>=1.8.5",
    "numpy",
    "scipy",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<1.16.0",
    # Also in pre-commit
    "nbstripout>=0.8,<0.9",
    "pytest>8.0",
    "pytest-cov>5.0",
    # Also in pre-commit
    "ruff>=0.12,<0.13",
    "pre-commit>=4.0,<5.0",
    "codespell>=2.3.0,<2.4.0",
    "nbmake",
]
doc = [
    "ipykernel>=6.30.1",
    "matplotlib",
    "jupyterlab",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25,<1",
    "pymdown-extensions>=10",
]

[tool.setuptools.packages.find]
include = ["gtotr*"]

[tool.setuptools.dynamic]
version = {attr = "gtotr.__version__"}

[tool.ruff.lint]
select = ["E", "F", "PL", "W", "I", "N", "NPY", "RUF", "B", "D", "FA", "UP", "TC", "ARG", "PIE"]
ignore = [
    # Ignored in conversion to ruff since not previously enforced
    "PLR2004",
    # Lower case in function, matching MATLAB names
    "N806",
    # Argument name lower case, matching MATLAB names
    "N803",
    # Class name not CapWords, matching MATLAB names
    "N801",
    # Numpy legacy random transition is a TODO
    "NPY002",
    # See #184 for issue related to asserts
    "B011",
    # There is ongoing discussion about logging/warning etc
    "B028",
    # Personal preference on magic method
    "D105",
    # Rule removed in newer version of ruff
    "UP038",
]

[tool.ruff.lint.pylint]
# these should be revisited and potentially removed as the codebase matures
max-args = 15
max-statements = 120
max-branches = 25

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# See  see https://github.com/astral-sh/ruff/issues/3172 for details on this becoming simpler

# Everything but I, F (to catch import mess and potential logic errors)
"tests/**.py" = ["E", "PL", "W", "N", "NPY", "RUF", "B", "D"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.mypy]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pyttb",
    "numpy",
    "statsmodels",
    "statsmodels.api",
    "scipy.special",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "gtotr"]
python_files = ["test_*.py"]
addopts = [
  "--doctest-modules",
]
markers = [
  "nbmake: run notebooks",
]


[build-system]
requires = ["setuptools", "pyttb", "numpy", "statsmodels"]
build-backend = "setuptools.build_meta"
